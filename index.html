<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Thumbnail Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="toolbar">
    <form id="thumbnailForm">
      <input
        type="text"
        id="username"
        placeholder="Twitch username"
        autocomplete="off"
        required
      >

      <button type="submit">Load</button>
    </form>

    <span id="status"></span>
  </header>

  <main class="viewer">
    <img
      id="thumbnail"
      alt="Twitch stream thumbnail"
    >
  </main>

  <script src="script.js"></script>
</body>
</html>
